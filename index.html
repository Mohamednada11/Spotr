<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}

/* Spotr design system
   Type scale (px): hero 48 · h1 34 · title 26 · h2 22 · lg 18 · body 16 · sm 14 · xs 12
   Space scale (px): 4 · 8 · 12 · 16 · 20 · 24 · 32 · 40
   Display face (condensed, uppercase) only for short labels: screen titles, session, muscle and exercise names, numbers.
   Everything people read in sentences uses the body face in sentence case. */
:root{
  --bg:#050B10; --surface:#0C1822; --surface-2:#132737; --surface-3:#1B3549;
  --line:rgba(226,236,245,.08); --line-strong:rgba(226,236,245,.18);
  --fg:#F3F6F9; --fg-2:#A8B8C6; --fg-3:#7D92A4;
  --accent:#992D3E; --accent-press:#7A2432; --accent-ink:#EF8597; --accent-soft:rgba(153,45,62,.24); --on-accent:#FFFFFF;
  --ok:#4CC497; --ok-soft:rgba(76,196,151,.13); --warn:#EBB955; --warn-soft:rgba(235,185,85,.12);
  --pos-l:#93B5F2; --pos-l-bg:rgba(96,140,220,.16); --pos-s:#D0A6EC; --pos-s-bg:rgba(190,120,220,.16);
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-hero:48px; --fs-h1:34px; --fs-title:26px; --fs-h2:22px; --fs-lg:18px; --fs-body:16px; --fs-sm:14px; --fs-xs:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:20px;
  --tap:48px; --tap-l:56px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8EDF1; --surface-3:#D9E1E8;
    --line:rgba(18,38,54,.09); --line-strong:rgba(18,38,54,.2);
    --fg:#10222F; --fg-2:#465A6B; --fg-3:#62778A;
    --accent:#992D3E; --accent-press:#7A2432; --accent-ink:#992D3E; --accent-soft:#F7E4E8; --on-accent:#FFFFFF;
    --ok:#17794F; --ok-soft:#E1F2EA; --warn:#8A5807; --warn-soft:#FBF0DA;
    --pos-l:#2C5DB3; --pos-l-bg:#E4ECFA; --pos-s:#7A3A9E; --pos-s-bg:#F1E6F7;
    --shadow:0 12px 40px rgba(16,34,47,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8EDF1; --surface-3:#D9E1E8;
  --line:rgba(18,38,54,.09); --line-strong:rgba(18,38,54,.2);
  --fg:#10222F; --fg-2:#465A6B; --fg-3:#62778A;
  --accent:#992D3E; --accent-press:#7A2432; --accent-ink:#992D3E; --accent-soft:#F7E4E8; --on-accent:#FFFFFF;
  --ok:#17794F; --ok-soft:#E1F2EA; --warn:#8A5807; --warn-soft:#FBF0DA;
  --pos-l:#2C5DB3; --pos-l-bg:#E4ECFA; --pos-s:#7A3A9E; --pos-s-bg:#F1E6F7;
  --shadow:0 12px 40px rgba(16,34,47,.18);
  color-scheme:light;
}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs-body);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;text-rendering:optimizeLegibility}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
#app{height:100%}
.shell{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.gut{padding-left:max(var(--s5),env(safe-area-inset-left,0px));padding-right:max(var(--s5),env(safe-area-inset-right,0px))}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{padding-block:var(--s3) var(--s8);display:flex;flex-direction:column;gap:var(--s6)}
section.stack > .eyebrow:first-child{margin-bottom:var(--s1)}

/* ---- type ---- */
.display{font-family:var(--f-display);font-weight:700;font-size:var(--fs-hero);line-height:.95;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:700;font-size:var(--fs-h1);line-height:1;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:700;font-size:var(--fs-h2);line-height:1.05;letter-spacing:.015em;text-transform:uppercase}
.headline{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.005em;text-wrap:balance}
.eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);line-height:1.3}
.lede{color:var(--fg-2);font-size:var(--fs-body);line-height:1.5;max-width:60ch;text-wrap:pretty}
.meta{color:var(--fg-2);font-size:var(--fs-sm);line-height:1.45;text-wrap:pretty}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600}
.stack{display:flex;flex-direction:column;gap:var(--s2)}
.stack-l{display:flex;flex-direction:column;gap:var(--s3)}
.intro{display:flex;flex-direction:column;gap:var(--s3)}

/* ---- header ---- */
.top{padding-top:calc(var(--s2) + env(safe-area-inset-top,0px));padding-bottom:var(--s1)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:var(--tap-l)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.16em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step-count{font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);text-align:center}
.progress{display:grid;gap:var(--s1);margin-top:var(--s2)}
.progress i{height:3px;border-radius:2px;background:var(--surface-3);transition:background .2s}
.progress i.on{background:var(--accent)}
.icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:50%;margin-left:-12px;flex:none;color:var(--fg)}
.icon-btn:active{background:var(--surface-2)}
.text-btn{min-height:var(--tap);padding:0 var(--s1);color:var(--accent-ink);font-weight:600;font-size:var(--fs-body);white-space:nowrap}
.text-btn:active{opacity:.6}
.top-title{flex:1;min-width:0}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--tap-l);border-radius:var(--r-m);font-weight:700;font-size:17px;letter-spacing:.01em;transition:background .12s,transform .12s var(--ease)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:active{background:var(--accent-press)}
.btn.primary:disabled{background:var(--surface-3);color:var(--fg-3)}
.btn.secondary{background:var(--surface-2);color:var(--fg)}
.btn.secondary:active{background:var(--surface-3)}
.btn.secondary:disabled{color:var(--fg-3);opacity:.6}
.btn.ghost{min-height:var(--tap);color:var(--accent-ink);font-weight:600;font-size:var(--fs-body)}
.bar{padding-block:var(--s3);border-top:1px solid var(--line);background:var(--bg)}
.bar .hint{margin-top:var(--s2);text-align:center;font-size:var(--fs-sm);color:var(--fg-2)}

/* ---- option cards ---- */
.opts{display:flex;flex-direction:column;gap:var(--s3)}
.opt{display:flex;align-items:center;gap:var(--s4);width:100%;text-align:left;padding:var(--s4) var(--s4) var(--s4) var(--s5);border-radius:var(--r-l);background:var(--surface);border:1.5px solid var(--line);min-height:76px;transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.opt-title{font-weight:700;font-size:var(--fs-lg);line-height:1.25}
.opt-sub{color:var(--fg-2);font-size:var(--fs-sm);line-height:1.45}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.opt.sel .check{background:var(--accent);border-color:var(--accent)}
.opt.sel .check::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.cyc{display:flex;flex-wrap:wrap;gap:6px;margin-block:2px}
.cyc span{font-size:var(--fs-xs);font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg-2)}
.opt.sel .cyc span{background:var(--surface)}
.note-warn{color:var(--warn);font-size:var(--fs-sm);font-weight:600}

/* ---- groups & rows ---- */
.group{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--line);overflow:hidden}
.group-title{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.row{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap-l);padding:var(--s3) var(--s4);width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
button.row:active,label.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:600;font-size:var(--fs-body);line-height:1.3}
.row-sub{font-size:var(--fs-sm);color:var(--fg-2);line-height:1.4}
.row-sub.warn{color:var(--warn)}
.chev{color:var(--fg-3);display:grid}
.chev svg{width:20px;height:20px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--surface-3);position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.pills{display:flex;gap:var(--s2)}
.pill{min-height:36px;padding:0 var(--s4);border-radius:999px;background:var(--surface-2);font-weight:600;font-size:var(--fs-sm);color:var(--fg)}
.pill:active{background:var(--surface-3)}

/* ---- stepper ---- */
.stepper{display:flex;align-items:center;flex:none;background:var(--surface-2);border-radius:999px}
.stepper button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;font-size:22px;font-weight:600;color:var(--fg);line-height:1}
.stepper button:active{background:var(--surface-3)}
.stepper button:disabled,.stepper button.off{color:var(--fg-3);opacity:.4}
.stepper output{min-width:36px;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stepper.sm button{width:40px;height:40px;font-size:20px}
.stepper.sm output{min-width:30px;font-size:20px}

/* ---- chips & tags ---- */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);font-weight:600;font-size:var(--fs-sm);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s}
.chip.on{background:var(--fg);color:var(--bg)}
.chip small{font-weight:500;font-size:var(--fs-xs);opacity:.8}
.tag{display:inline-flex;align-items:center;font-size:var(--fs-xs);font-weight:600;line-height:1.5;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.pos-L{background:var(--pos-l-bg);color:var(--pos-l)}
.tag.pos-S{background:var(--pos-s-bg);color:var(--pos-s)}
.tag.pos-B{background:var(--surface-2);color:var(--fg-2)}
.loadline{display:flex;flex-wrap:wrap;gap:6px}

/* ---- notices ---- */
.notice{border-radius:var(--r-m);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:6px;font-size:var(--fs-sm);line-height:1.45}
.notice svg{width:18px;height:18px;flex:none}
.notice.ok{background:var(--ok-soft);color:var(--ok);font-weight:600;flex-direction:row;align-items:center;gap:var(--s2)}
.notice.warn{background:var(--warn-soft);color:var(--fg)}
.notice.warn .n-title{color:var(--warn);font-weight:700}
.notice.info{background:var(--surface);border:1px solid var(--line);color:var(--fg-2)}
.notice.info b{color:var(--fg)}
.n-item{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);color:var(--fg);min-height:40px}
.n-item + .n-item{border-top:1px solid var(--line)}
.n-item span{min-width:0}
.n-item button{flex:none;min-height:34px;padding:0 var(--s3);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;color:var(--accent-ink)}
details.sugg > summary{cursor:pointer;color:var(--fg-2);font-weight:600;font-size:var(--fs-sm);min-height:var(--tap);display:flex;align-items:center;gap:6px;list-style:none}
details.sugg > summary::-webkit-details-marker{display:none}
details.sugg > summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);margin-left:4px;transition:transform .15s}
details.sugg[open] > summary::after{transform:rotate(225deg) translateY(-1px)}
details.sugg[open] > summary{margin-bottom:var(--s2)}

/* ---- muscle blocks & exercise cards ---- */
.mname{font-family:var(--f-display);font-weight:700;font-size:var(--fs-title);text-transform:uppercase;letter-spacing:.015em;line-height:1}
.mblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s5) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.mblock.short{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.mcount{font-size:var(--fs-sm);color:var(--fg-2);line-height:1.4}
.mcount b{font-family:var(--f-display);font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums;margin-right:2px}
.mprog{display:flex;flex-direction:column;gap:var(--s2)}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--warn);border-radius:3px;transition:width .25s var(--ease)}
.pbar i.ok{background:var(--ok)}
.mnote{font-size:var(--fs-sm);line-height:1.4;color:var(--fg-2)}
.mnote.warn{color:var(--warn);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s4) var(--s3) var(--s2) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.mblock .ex{background:var(--bg)}
.ex-top{display:flex;align-items:flex-start;gap:var(--s3)}
.ex-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ex-name{font-weight:700;font-size:17px;line-height:1.25}
.ex-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:var(--fs-sm);color:var(--fg-2)}
.ex-sec{font-size:13px;color:var(--fg-3);line-height:1.4}
.ex-actions{display:flex;gap:var(--s1);margin-left:-10px}
.ex-actions button{min-height:40px;padding:0 10px;border-radius:999px;font-size:var(--fs-sm);font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.ex-actions button svg{width:18px;height:18px}
.ex-actions button:active{background:var(--surface-2)}
.add-btn{border:1.5px dashed var(--line-strong);border-radius:var(--r-m);min-height:var(--tap-l);display:flex;align-items:center;justify-content:center;gap:var(--s2);font-weight:700;color:var(--accent-ink);width:100%}
.add-btn svg{width:20px;height:20px}
.add-btn:active{background:var(--surface-2)}
.add-btn.strong{border-style:solid;border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:var(--accent-soft)}
.full-note{padding:10px var(--s3);border-radius:var(--r-s);background:var(--surface-2);font-size:13px;color:var(--fg-2);line-height:1.4}
.xblock{border-style:dashed}
.xctrl{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s5);margin-top:var(--s1)}
.xc{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.xl{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:var(--s3) var(--s4);border-radius:var(--r-m);border:1.5px dashed var(--line-strong);background:transparent;position:relative;min-height:var(--tap-l)}
.slot:active{background:var(--surface-2)}
.slot-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.slot-name{font-weight:700;font-size:var(--fs-body)}
.slot-sub{font-size:13px;color:var(--fg-2);padding-right:72px}
.slot-cta{position:absolute;right:var(--s3);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;font-weight:700;font-size:var(--fs-sm);color:var(--accent-ink);padding:6px 10px;border-radius:999px;background:var(--accent-soft)}
.slot-cta svg{width:16px;height:16px}
.slot-h{font-size:var(--fs-sm);color:var(--fg-2)}
.slot-h b{color:var(--fg)}
.day-head{display:flex;flex-direction:column;gap:6px}
.day-title{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.day-title .text-btn{font-size:var(--fs-sm);min-height:40px}
.daynav{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.daynav .btn{font-size:15px;min-height:var(--tap)}

/* ---- volume ---- */
.daysum{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2)}
.daysum span{display:flex;flex-direction:column;gap:2px;padding:10px var(--s3);border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--fg-2);font-weight:600}
.daysum b{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.vrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s4) var(--s2)}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vsub{font-size:13px;color:var(--fg-3)}
.big{font-size:24px}
.mwrap{padding:0 var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.meter{position:relative;padding-top:34px}
.m-track{position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
.m-zone{position:absolute;top:-6px;bottom:-6px;border-left:2px solid var(--ok);border-right:2px solid var(--ok);background:linear-gradient(var(--ok-soft),var(--ok-soft)) center/100% 6px no-repeat}
.m-pin{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--fg-2);box-shadow:0 0 0 3px var(--surface);z-index:1;transition:left .25s var(--ease)}
.m-pin.in{background:var(--ok)}
.m-bub{position:absolute;bottom:calc(100% + 9px);white-space:nowrap;font-size:var(--fs-xs);font-weight:600;padding:3px 9px;border-radius:var(--r-s);background:var(--surface-2);color:var(--fg)}
.m-bub b{font-size:13px}
.m-pin.in .m-bub{background:var(--ok-soft);color:var(--ok)}
.m-bub::after{content:"";position:absolute;top:100%;border:5px solid transparent;border-top-color:var(--surface-2)}
.m-pin.in .m-bub::after{border-top-color:var(--ok-soft)}
.m-bub.c{left:50%;transform:translateX(-50%)} .m-bub.c::after{left:50%;margin-left:-5px}
.m-bub.l{left:-4px} .m-bub.l::after{left:6px}
.m-bub.r{right:-4px} .m-bub.r::after{right:6px}
.m-scale{position:relative;height:16px;margin-top:var(--s2);font-size:var(--fs-xs);font-weight:600;color:var(--fg-3);font-variant-numeric:tabular-nums}
.m-scale span{position:absolute;transform:translateX(-50%)}
.m-scale span.z{color:var(--fg-2)}
.m-zlabel{position:relative;text-align:center;font-size:11px;font-weight:600;color:var(--ok);white-space:nowrap;margin-top:-1px}
.m-adj{font-size:13px;color:var(--fg-3);line-height:1.4}
.vtotal{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s1);padding:10px var(--s3);border-radius:var(--r-m);background:var(--surface-2)}
.vt-l{font-size:13px;font-weight:600;color:var(--fg-2)}

.vt-r{display:flex;align-items:center;gap:var(--s2)}
.vt-n{font-size:17px;color:var(--fg-2)} .vt-n b{color:var(--fg);font-size:20px}
.alloc{border-top:1px solid var(--line);padding:var(--s2) 0 var(--s1);background:color-mix(in srgb,var(--surface-2) 40%,transparent)}
.alloc-h{margin:var(--s2) var(--s4) var(--s1);font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.arow{display:flex;align-items:center;gap:10px;padding:2px var(--s3) 2px var(--s4);min-height:48px}
.aname{flex:1;min-width:0;font-weight:600}
.alloc-ro{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--s4) var(--s1)}
.pl-wrap{padding:var(--s3) var(--s4) var(--s4)}
.pl{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:700}
.pl svg{width:16px;height:16px}
.pl.ok{color:var(--ok)}
.pl.warn{color:var(--warn)}
.pl-sub{display:block;margin-top:var(--s1);font-size:13px;color:var(--fg-3)}
.cc-intro{padding:var(--s4);font-size:var(--fs-sm);color:var(--fg-2);line-height:1.5}
.crow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px var(--s3);padding:var(--s3) var(--s4);border-top:1px solid var(--line)}
.crow .row-title{grid-column:1}
.crow .seg{grid-column:2;grid-row:1}
.crow .row-sub{grid-column:1 / -1;font-size:13px}
.seg.mini{grid-auto-columns:40px;padding:2px;gap:2px;border-radius:10px}
.seg.mini button{min-height:36px;font-size:15px;border-radius:8px}

/* ---- coverage ---- */
.cov{display:flex;flex-wrap:wrap;gap:4px 14px;margin:2px 0 0;padding:0;list-style:none}
.cov li{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--fg-3)}
.cov li svg{width:14px;height:14px}
.cov li.ok{color:var(--ok)}
.cov li.warn{color:var(--warn)}
.cov li i{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}

/* ---- today ---- */
.cycle-strip{display:flex;gap:6px;flex-wrap:wrap}
.cycle-strip span{font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg-3)}
.cycle-strip span.now{background:var(--accent);color:var(--on-accent)}
.cycle-strip span.done{color:var(--fg-2)}
.plan-item{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);min-height:64px}
.plan-item + .plan-item{border-top:1px solid var(--line)}
.plan-sets{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;min-width:40px;font-variant-numeric:tabular-nums}
.plan-sets small{font-size:15px;color:var(--fg-3);font-weight:600;margin-left:1px}
.today-links{display:flex;gap:var(--s5);flex-wrap:wrap}
.today-links .text-btn{padding:0;min-height:40px}
.empty{display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start;padding:var(--s6) var(--s5);border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.resume{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s5);border-radius:var(--r-l);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}

/* ---- review table ---- */
.kv{display:grid;grid-template-columns:1fr auto}
.kv div{padding:var(--s3) var(--s4);border-top:1px solid var(--line)}
.kv div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--fg-2)}
.kv .v{font-weight:600;text-align:right}

/* ---- segmented ---- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-m);padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:var(--fs-sm);color:var(--fg-2);transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ---- tab bar ---- */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-xs);font-weight:600;color:var(--fg-3);transition:color .15s}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--fg)}
.tabbar button.on svg{color:var(--accent-ink)}
.bar + .tabbar,.shell > .bar:last-child{padding-bottom:max(var(--s3),env(safe-area-inset-bottom,0px))}

/* ---- sheet / dialog / toast ---- */
.backdrop{position:fixed;inset:0;background:rgba(2,6,10,.55);z-index:20;animation:fade .18s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto;animation:up .24s var(--ease);box-shadow:var(--shadow)}
.sheet-head{padding-top:10px;padding-bottom:var(--s4);display:flex;flex-direction:column;gap:var(--s3);border-bottom:1px solid var(--line)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 2px}
.sheet-title{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
.sheet-title .icon-btn{margin:-8px -12px 0 0}
.sheet-body{overflow-y:auto;padding-block:var(--s4) var(--s6);display:flex;flex-direction:column;gap:var(--s3);overscroll-behavior:contain}
.search{width:100%;min-height:46px;border-radius:var(--r-m);border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);padding:0 var(--s4);font:inherit;font-size:var(--fs-body)}
.search::placeholder{color:var(--fg-3)}
.pick{display:flex;align-items:stretch;gap:var(--s1);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m)}
.pick.best{border-color:color-mix(in srgb,var(--accent) 80%,transparent)}
.pick-main{flex:1;min-width:0;text-align:left;padding:var(--s3) var(--s1) var(--s3) var(--s4);display:flex;flex-direction:column;gap:6px}
.pick-name{font-weight:700;font-size:var(--fs-body);line-height:1.3}
.pick-sec{font-size:13px;color:var(--fg-3)}
.why{font-size:13px;font-weight:600;line-height:1.4}
.why.ok{color:var(--ok)} .why.warn{color:var(--warn)}
.badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:2px 8px;border-radius:999px}
.fav{width:48px;flex:none;display:grid;place-items:center;font-size:20px;color:var(--fg-3)}
.fav.on{color:var(--warn)}
.mrow{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:var(--s3) var(--s4);border-radius:var(--r-m);background:var(--bg);border:1px solid var(--line);min-height:var(--tap-l)}
.mrow:active:not(:disabled){background:var(--surface-2)}
.mrow:disabled{opacity:.45}
.mrow svg{color:var(--accent-ink);flex:none;width:20px;height:20px}
.dialog{position:fixed;left:var(--s4);right:var(--s4);top:50%;transform:translateY(-50%);z-index:31;background:var(--surface);border-radius:var(--r-xl);padding:var(--s6) var(--s5) var(--s5);display:flex;flex-direction:column;gap:var(--s3);max-width:400px;margin:0 auto;box-shadow:var(--shadow);animation:pop .2s var(--ease)}
.dialog .btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
.toast{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;margin:0 auto;max-width:420px;background:var(--fg);color:var(--bg);border-radius:var(--r-m);padding:var(--s3) var(--s4);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);font-weight:600;font-size:15px;line-height:1.35;animation:up .22s var(--ease);box-shadow:var(--shadow)}
.toast button{color:#F6A3B0;font-weight:700;min-height:36px;padding:0 6px;flex:none}
#toast-root.top .toast{top:calc(var(--s3) + env(safe-area-inset-top,0px));bottom:auto}
:root[data-theme="dark"] .toast button{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast button{color:var(--accent)}}

/* ---- welcome ---- */
.welcome{display:flex;flex-direction:column;gap:var(--s7);padding-top:calc(10vh + env(safe-area-inset-top,0px))}
.welcome .mark{font-family:var(--f-display);font-weight:700;font-size:64px;letter-spacing:.14em;line-height:.9;display:flex;align-items:center;gap:var(--s4)}
.welcome .mark i{width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.steps-list{display:flex;flex-direction:column;border-left:2px solid var(--surface-3);margin-left:5px}
.steps-list span{padding:7px 0 7px var(--s5);color:var(--fg-2);position:relative;font-weight:500}
.steps-list span::before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface-3)}
.steps-list span b{color:var(--fg-3);font-family:var(--f-display);font-weight:600;margin-right:10px;font-variant-numeric:tabular-nums}

/* ---- workout ---- */
.wk-title{display:flex;flex-direction:column;align-items:center;min-width:0;gap:1px}
.wk-name{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.wk-time{font-size:13px;color:var(--fg-2);font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.02em}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px}
.dot{width:26px;height:26px;display:grid;place-items:center}
.dot i{width:9px;height:9px;border-radius:50%;background:var(--surface-3);transition:background .2s}
.dot.part i{background:var(--warn)} .dot.done i{background:var(--ok)} .dot.skip i{background:var(--fg-3);opacity:.5}
.dot.cur i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.target{display:grid;grid-template-columns:1fr .8fr 1.35fr;gap:var(--s2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s3) var(--s4)}
.target > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.target b{font-size:22px;line-height:1.1}
.tl{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.rest-adj{display:flex;align-items:center;gap:6px}
.rest-adj button{width:30px;height:30px;border-radius:50%;background:var(--surface-2);font-weight:700;flex:none;display:grid;place-items:center}
.rest-adj button:active{background:var(--surface-3)}
.srow{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:0 var(--s4);border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);text-align:left}
.srow-main{flex:1;display:flex;align-items:center;gap:var(--s3);min-height:56px;text-align:left}
.srow .x{width:44px;height:44px;display:grid;place-items:center;color:var(--fg-3);margin-right:-12px}
.srow .x svg{width:18px;height:18px}
.sn{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--fg-3);width:18px}
.sv{flex:1;font-size:21px}
.sv.muted{color:var(--fg-3)}
.tick-box{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none}
.tick-box svg{width:18px;height:18px}
.tick-box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sopen{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r-l);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
.sopen-h{display:flex;justify-content:space-between;align-items:center;min-height:24px}
.big-in{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.bi{display:flex;flex-direction:column;gap:6px;min-width:0}
.bstep{display:flex;align-items:stretch;background:var(--bg);border-radius:var(--r-m);border:1px solid var(--line-strong);overflow:hidden}
.bstep button{width:44px;flex:none;font-size:24px;font-weight:600;min-height:60px}
.bstep button:active{background:var(--surface-2)}
.num-in{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);text-align:center;font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;padding:0}
.num-in::placeholder{color:var(--fg-3);font-weight:600}
.num-in:focus{outline:none;background:var(--accent-soft)}
.bsub{font-size:var(--fs-xs);color:var(--fg-3)}
.rpe{display:flex;flex-direction:column;gap:var(--s2)}
.rpe-row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.rpe-row button{min-height:46px;border-radius:10px;background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:18px;transition:background .12s}
.rpe-row button.on{background:var(--accent);color:var(--on-accent)}
.rpe-hint{font-size:13px;color:var(--fg-2)}
.hint-c{margin-top:calc(var(--s2) * -1);text-align:center;font-size:13px;color:var(--fg-3)}
.wk-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s1);margin-top:calc(var(--s2) * -1)}
.wk-actions .btn{width:auto;padding:0 var(--s2);font-size:15px}
.wk-actions svg{width:18px;height:18px}
.wk-nav{display:grid;grid-template-columns:64px 1fr;gap:var(--s3)}
.nx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wk-nav .btn{min-width:0}
.timer{background:var(--surface-2);border-top:1px solid var(--line);transition:background .25s}
.timer.over{background:var(--accent);color:var(--on-accent)}
.timer.over .tl{color:var(--on-accent);opacity:.85}
.t-in{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-block:10px}
.t-info{display:flex;flex-direction:column;gap:2px}
.t-time{font-size:40px;line-height:1;font-weight:700}
.t-btns{display:flex;gap:var(--s2)}
.t-btns button{min-width:48px;height:48px;border-radius:999px;background:var(--surface-3);font-weight:700;font-size:15px;display:grid;place-items:center;padding:0 10px}
.t-btns button svg{width:20px;height:20px}
.timer.over .t-btns button{background:rgba(255,255,255,.18);color:#fff}
.t-prog{height:3px}
.t-prog i{display:block;height:100%;background:var(--accent-ink);transition:width .25s linear}
.timer.over .t-prog i{background:#fff}
.xsets{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s1)}
.xs{min-height:44px;padding:0 var(--s4);border-radius:999px;background:var(--surface-2);font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.xs svg{width:16px;height:16px}
.xs.on{background:var(--ok-soft);color:var(--ok)}
.xs.t{background:transparent;border:1.5px solid var(--line-strong)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:6px}
.tile b{font-size:32px;line-height:1}
.tile small{font-size:var(--fs-sm);color:var(--fg-3);font-family:var(--f-body);font-weight:500}
.warm-step{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r-l);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.ws-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.ws-h .text-btn{white-space:nowrap}
.wstep{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:var(--s3);border-radius:var(--r-m);background:var(--bg);border:1px solid var(--line);min-height:60px;transition:opacity .15s}
.wstep.next{border-color:var(--accent-ink)}
.wstep.done{opacity:.55}
.wstep.done b{text-decoration:line-through}
.ws-n{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--fg-3);width:18px}
.ws-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ws-main b{font-size:20px}
.ws-main span{font-size:13px;color:var(--fg-2)}
.dim{opacity:.55}
.warm-note{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.warm-note svg{width:16px;height:16px}
.warm-note.off{color:var(--fg-3)}
.text-btn.inl0{min-height:0;padding:0;font-size:var(--fs-sm)}
.add-warm{align-self:flex-start}
textarea.bk{width:100%;min-height:200px;border-radius:var(--r-m);border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);padding:var(--s3);font:13px/1.45 ui-monospace,Menlo,monospace}
label.row{cursor:pointer}
.foot{font-size:13px;color:var(--fg-3);text-align:center}

@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(-50%) scale(.96);opacity:0}to{transform:translateY(-50%);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function evenAlloc(days,targets){
  const A = {};
  MIDS.forEach(m => {
    const arr = days.map(() => 0), idx = trainedDays(days,m), n = idx.length;
    if (n) { const base = Math.floor(targets[m]/n); let rem = targets[m]%n; idx.forEach(i => { arr[i] = base+(rem>0?1:0); rem--; }); }
    A[m] = arr;
  });
  return A;
}
function nudgeAlloc(meta,m,dir){
  const idx = trainedDays(meta.days,m), a = meta.alloc[m]; if (!idx.length) return;
  if (dir > 0) { let best = idx[0]; idx.forEach(i => { if (a[i] < a[best]) best = i; }); a[best]++; }
  else { let best = -1; idx.forEach(i => { if (a[i] > 0 && (best<0 || a[i] >= a[best])) best = i; }); if (best >= 0) a[best]--; }

/* Day builder: skeleton of muscle slots with allocated sets; user fills each slot */
function builder(ctx){

  const di = UI.dayIdx, day = days[di], an = analyze(days), L = an.dl[di], Lt = an.load[di], st = dayStats(day), f = dayFill(meta,di,an);
  const chips = days.map((d,i) => { const fi = dayFill(meta,i,an);
    return `<button class="chip ${i===di?"on":""}" data-act="day" data-i="${i}">${esc(d.label)} <small>${fi.done?"✓":fi.left>0?fmt(fi.left)+" left":"—"}</small></button>`; }).join("");
  const skipped = [];
  const blocks = DAYTYPES[day.type].muscles.map(m => {
    const a = A[m][di], items = day.items.map((it,j) => ({it,j})).filter(x => !x.it.extra && LIB[x.it.ex].primary===m);
    if (!a && !items.length) { skipped.push(m); return ""; }
    const filled = L[m], helper = Lt[m]-L[m], d = a-filled;
    let status;

    const req = missing(m,days,"Required").map(r => r.pattern.toLowerCase());
    const rec = [...missing(m,days,"Recommended").map(r => r.pattern.toLowerCase()), ...lengthMissing(m,days).map(p => POS[p].toLowerCase()+" position")];
    const pct = a ? Math.min(100,filled/a*100) : 0;
    const plan = S.showSlots !== false ? slotPlan(meta,di,m,an) : [];
    const open = d > TOL ? plan.filter(p => !p.filled) : [];
    const hintLine = (req.length ? `<p class="mnote warn">Your cycle still needs ${esc(req.join(" and "))}.</p>` : "")

    const slotCards = open.map(p => `<button class="slot" data-act="slot-pick" data-ctx="${ctx}" data-d="${di}" data-m="${m}" data-k="${p.k}"><span class="slot-tag">Suggested · ${plural(p.sets,"set")}</span><span class="slot-name">${esc(p.name)}</span><span class="slot-sub">${slotSub(p)}</span><span class="slot-cta">${IC.plus}Pick</span></button>`).join("");

      return `<div class="ex"><div class="ex-top"><div class="ex-main"><span class="ex-name">${esc(ex.name)}</span>

        ${stepper(it.sets,"sets",`data-ctx="${ctx}" data-d="${di}" data-j="${j}"`,1,d>TOL?4:it.sets,"sm","1 set is the minimum. Remove the exercise to drop it.",it.sets>=4?"4 sets is the maximum per exercise. Add another exercise instead.":`${M[m].name} on ${day.label} is full. Raise it in Volume to add sets.`)}</div>
        <div class="ex-actions"><button data-act="ex-swap" data-ctx="${ctx}" data-d="${di}" data-j="${j}">${IC.swap}Swap</button><button data-act="ex-remove" data-ctx="${ctx}" data-d="${di}" data-j="${j}">${IC.trash}Remove</button></div></div>`; }).join("");
    return `<section class="mblock ${a && d>TOL?"short":""}">
      <div class="mhead"><h3 class="mname">${M[m].name}</h3>${status}</div>

      <div class="pbar" aria-hidden="true"><i class="${a && Math.abs(d)<=TOL?"ok":""}" style="width:${pct}%"></i></div></div>
      ${hintLine}

      <p class="meta">${sessTxt(st)}</p></div>

    ${over.length?`<div class="notice warn"><span class="n-title">Over the 11-set session cap</span><span>${over.map(m => `${M[m].name} ${fmt(Lt[m])}`).join(" · ")}. Move sets to another day in Volume.</span></div>`:""}
    ${blocks}

    <div class="daynav">${di>0?`<button class="btn secondary" data-act="day" data-nav="1" data-i="${di-1}">${IC.back}${esc(days[di-1].label)}</button>`:"<span></span>"}${di<days.length-1?`<button class="btn secondary" data-act="day" data-nav="1" data-i="${di+1}">${esc(days[di+1].label)}${IC.chev}</button>`:"<span></span>"}</div>
    ${skipped.length?`<p class="meta">Not trained on this day (0 sets allocated): ${skipped.map(m => M[m].name).join(", ")}. Change it in Volume.</p>`:""}`;

/* ---------- Workout logging ---------- */
const RPES = [6,7,7.5,8,8.5,9,9.5,10];
const restSec = ex => S.restOverride[ex.id] ?? (ex.type==="Compound" ? 150 : 90);
const mmss = s => { s = Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const repLow = ex => parseInt(prescription(ex).reps) || 8;
const roundInc = (v,inc) => Math.max(0, Math.round(v/inc)*inc);
const fmtW = w => w==null ? "—" : (Math.round(w*100)/100).toString();
const wTxt = (ex,w) => ex.eq==="Bodyweight" && !w ? "BW" : fmtW(w)+" kg";
const rpeHint = v => v>=10?"Failure, no reps left":v>=9.5?"Maybe half a rep left":v>=9?"1 rep left":v>=8.5?"1–2 reps left":v>=8?"2 reps left":v>=7.5?"2–3 reps left":v>=7?"3 reps left":"4+ reps left · doesn't count as a hard set";
function lastSets(exId){
  for (let i=S.history.length-1;i>=0;i--) { const e = S.history[i].entries.find(e => e.ex===exId && e.sets.length); if (e) return {date:S.history[i].date, sets:e.sets}; }
  return null;
}
const e1rm = (w,r,rpe) => !r ? 0 : (w||0)*(1+(r+(rpe?Math.max(0,10-rpe):0))/30);
function bestE1rm(exId,beforeId){
  let b = 0;
  S.history.forEach(h => { if (beforeId && h.id >= beforeId) return; h.entries.forEach(e => { if (e.ex===exId) e.sets.forEach(s => { b = Math.max(b,e1rm(s.w,s.r,s.rpe)); }); }); });
  return b;
}
function makeEntry(exId,n,warm){
  const ex = LIB[exId], last = lastSets(exId), bw = ex.eq==="Bodyweight";
  const sets = Array.from({length:n},(_,k) => { const p = last ? last.sets[Math.min(k,last.sets.length-1)] : null;
    return {w:p?p.w:(bw?0:null), r:p?p.r:repLow(ex), rpe:null, done:false}; });
  return {kind:"ex",ex:exId,sets,warm,phase:warm?"warm":"work",warmDone:[false,false,false,false],test:!last,open:0,skipped:false};
}
function startWorkout(di){
  const day = S.program.days[di], entries = [], seen = new Set();
  const mode = S.warmMode || "firstPerMuscle";
  day.items.filter(i => !i.extra).forEach((it,idx) => { const ex = LIB[it.ex];
    const warm = mode==="firstPerMuscle" ? ex.type==="Compound" && !seen.has(ex.primary) : mode==="firstOnly" ? idx===0 : mode==="everyCompound" ? ex.type==="Compound" : false;
    if (ex.type==="Compound") seen.add(ex.primary); entries.push(makeEntry(it.ex,it.sets,warm)); });
  const xs = [...day.items.filter(i => i.extra).map(i => ({kind:"core",ex:i.ex,sets:i.sets,done:Array(i.sets).fill(false)})),
    ...(day.extras||[]).map(e => ({kind:"x",x:e.x,sets:e.sets,dose:e.dose,done:Array(XB[e.x].unit==="m"?1:e.sets).fill(false)}))];
  S.active = {dayIdx:di,label:day.label,type:day.type,startedAt:Date.now(),cur:0,entries,xs,restEnd:null,restTotal:0,restLabel:"Rest",restAlerted:true};
  UI.mode = "workout"; UI.pickDay = null; save(); render(); toTop();
}
const screens = a => a.entries.length + (a.xs.length ? 1 : 0);
function warmups(e){
  const ex = LIB[e.ex], w = e.sets[0].w; if (!w) return [];
  const inc = incFor(ex), steps = [];
  if (["Barbell","Smith machine","EZ bar"].includes(ex.eq) && w >= 40) steps.push({w:ex.eq==="EZ bar"?10:20,r:10,why:"Empty bar · groove the movement"});
  const n = w < 20 ? 1 : w < 40 ? 2 : 3;
  [[.5,8,"Easy · move fast, focus on form"],[.7,5,"Moderate · feel the working path"],[.85,3,"Near working weight · prime, don't tire"]].slice(3-n)

  return steps;
}
function warmBlock(e,ex){

  const needW = !bw && w == null;
  return `<section class="warm-step">

  "adj":d => { const a = S.active, e = a.entries[a.cur], s = e.sets[e.open], ex = LIB[e.ex];
    if (d.f === "w") s.w = Math.max(0, Math.round(((s.w ?? 0) + (+d.dir)*incFor(ex))*100)/100);
    else s.r = clamp(s.r+(+d.dir),1,100);
    save(); render(); },
  "rpe":d => { const a = S.active, e = a.entries[a.cur]; e.sets[e.open].rpe = +d.v; save(); render(); },
  "log":() => { const a = S.active, e = a.entries[a.cur], k = e.open, s = e.sets[k], ex = LIB[e.ex]; if (!s || s.w==null || !s.r || s.rpe==null) return;
    const wasDone = s.done; s.done = true; s.at = Date.now();
    e.sets.forEach((o,j) => { if (j > k && !o.done && (e.test || o.w == null)) { o.w = s.w; if (e.test) o.r = s.r; } });
    const next = e.sets.findIndex(o => !o.done); e.open = next;
    if (!wasDone) startTimer(restSec(ex),"Rest");
    if (next < 0) toast(`${ex.name} done`);
    save(); render(); },
  "set-add":() => { const e = S.active.entries[S.active.cur], l = e.sets[e.sets.length-1]; e.sets.push({w:l.w,r:l.r,rpe:null,done:false}); e.open = e.sets.length-1; save(); render(); },
  "set-del":d => { const e = S.active.entries[S.active.cur], k = +d.k; if (e.sets.length < 2 || e.sets[k].done) return; e.sets.splice(k,1); e.open = e.sets.findIndex(o => !o.done); save(); render(); },
  "warm":d => { const e = S.active.entries[S.active.cur], k = +d.k, n = warmups(e).length; e.warmDone[k] = !e.warmDone[k];
    if (e.warmDone[k]) { if (e.warmDone.slice(0,n).every(Boolean)) { e.phase = "work"; e.open = e.sets.findIndex(o => !o.done); toast("Warm-up done · working sets next"); } else startTimer(60,"Warm-up rest"); }
    save(); render(); },
  "warm-done":() => { const e = S.active.entries[S.active.cur]; e.phase = "work"; e.open = e.sets.findIndex(o => !o.done); save(); render(); toTop(); },
  "warm-skip":() => { const e = S.active.entries[S.active.cur]; e.phase = "work"; e.warmDone = [false,false,false,false]; e.open = e.sets.findIndex(o => !o.done); save(); render(); toTop(); },
  "warm-add":() => { const e = S.active.entries[S.active.cur]; e.warm = true; e.phase = "warm"; e.open = 0; save(); render(); toTop(); },
  "wk-skip":() => { const a = S.active, e = a.entries[a.cur]; if (e.sets.some(s => s.done)) return ask("Skip this exercise?","The sets you logged here won't be saved.","Skip",() => { e.skipped = true; if (a.cur+1 < screens(a)) a.cur++; });
    e.skipped = true; if (a.cur+1 < screens(a)) a.cur++; save(); render(); toTop(); },
  "wk-unskip":() => { const e = S.active.entries[S.active.cur]; e.skipped = false; e.open = e.sets.findIndex(o => !o.done); save(); render(); },
  "wk-swap":() => { const a = S.active, e = a.entries[a.cur]; if (e.sets.some(s => s.done)) { toast("You've logged sets here. Finish or skip this exercise instead."); render(); return; } UI.sheet = {kind:"wswap",i:a.cur}; render(); },
  "wswap-pick":d => { const a = S.active, i = UI.sheet.i, old = a.entries[i], id = +d.ex;
    const ne = makeEntry(id,old.sets.length,old.warm); ne.swappedFrom = old.swappedFrom ?? old.ex; ne.phase = old.phase; ne.warmDone = old.warmDone; a.entries[i] = ne; UI.sheet = null; toast("Swapped to "+LIB[id].name+" for today"); save(); render(); },
  "rest-adj":d => { const ex = LIB[S.active.entries[S.active.cur].ex]; S.restOverride[ex.id] = clamp(restSec(ex)+(+d.dir)*15,15,600); save(); render(); },
  "t-adj":d => { const a = S.active; a.restEnd += (+d.dir)*15000; a.restTotal = Math.max(15,a.restTotal+(+d.dir)*15); if (a.restEnd > Date.now()) a.restAlerted = false; save(); render(); },
  "t-skip":() => { S.active.restEnd = null; save(); render(); },
  "xdone":d => { const x = S.active.xs[+d.i]; x.done[+d.k] = !x.done[+d.k]; save(); render(); },
  "hold":d => { startTimer(+d.s,d.l); save(); render(); },
  "wk-finish":() => { const a = S.active, logged = loggedSets(a), pend = pendingSets(a);
    if (!logged) return ask("Nothing logged","Discard this workout? The cycle stays on "+a.label+".","Discard",() => { S.active = null; UI.mode = null; UI.tab = "today"; toast("Workout discarded"); });
    if (pend) return ask("Finish workout?",`${pend} set${pend>1?"s are":" is"} not logged and won't be saved.`,"Finish",finishWorkout);
    finishWorkout(); },
  "sum-done":() => { UI.mode = null; UI.tab = UI.sumBack || "today"; render(); toTop(); },
  "hist-open":d => { UI.mode = "summary"; UI.sumId = +d.id; UI.sumBack = "progress"; render(); toTop(); },
  "bk-copy":() => { const txt = JSON.stringify(S);
    const ok = () => { S.lastBackup = Date.now(); save(); toast("Backup copied. Paste it into Notes or Files to keep it."); render(); };
    try { navigator.clipboard.writeText(txt).then(ok, () => { UI.sheet = {kind:"bktext"}; render(); }); } catch(e) { UI.sheet = {kind:"bktext"}; render(); } },
  "bk-file":async () => { const txt = JSON.stringify(S), name = `spotr-backup-${new Date().toISOString().slice(0,10)}.json`;
    try { const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) { try { await dl.save({filename:name,data:txt}); S.lastBackup = Date.now(); save(); toast("Backup file saved"); render(); }
        catch(err) { if (!err || err.code !== "declined") { toast("Saving a file isn't available here. Use Copy backup."); render(); } } return; }
    } catch(e) {}
    try { const file = new File([txt],name,{type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})) { navigator.share({files:[file]}).then(() => { S.lastBackup = Date.now(); save(); render(); }, () => {}); return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      S.lastBackup = Date.now(); save(); toast("If no file was saved, use Copy backup instead."); render();
    } catch(e) { toast("Saving a file isn't available here. Use Copy backup."); render(); } },
  "bk-paste":() => { UI.sheet = {kind:"bkpaste"}; render(); },
  "bk-paste-go":() => { const t = document.getElementById("bk-txt"); UI.sheet = null; restoreFrom(t ? t.value : ""); }
};

/* ---------- Render ---------- */
const $app = document.getElementById("app"), $toast = document.getElementById("toast-root");
function viewKey(){ return UI.setup ? "s"+UI.step : UI.mode==="workout" && S.active ? "w"+S.active.cur : UI.mode==="summary" ? "m"+UI.sumId : "t"+UI.tab+UI.progView+UI.sub; }
function render(){
  const sc = $app.querySelector(".scroll"), top = sc ? sc.scrollTop : 0, key = UI.viewKey;
  $app.innerHTML = (UI.setup ? renderSetup() : UI.mode==="workout" && S.active ? renderWorkout() : UI.mode==="summary" ? renderSummary() : renderMain()) + renderSheet() + renderConfirm();
  $toast.className = UI.mode==="workout" && S.active && !UI.setup ? "top" : "";
  const nk = viewKey(), ns = $app.querySelector(".scroll");
  if (ns && nk === key) ns.scrollTop = top;
  UI.viewKey = nk;
}
function applyTheme(){ const r = document.documentElement; if (S.theme==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",S.theme);
  const mc = document.querySelector('meta[name="theme-color"]'); if (mc) mc.setAttribute("content", getComputedStyle(r).getPropertyValue("--bg").trim() || "#050B10"); }
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (S.theme==="system") applyTheme(); }); } catch(e){}
function toast(text,undo){ UI.toast = {text,undo:!!undo}; $toast.innerHTML = renderToast(); clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 5000 : clamp(1800 + text.length*45, 2200, 6000)); }
function hideToast(){ clearTimeout(toastTimer); UI.toast = null; UI.undo = null; $toast.innerHTML = ""; }
function ask(title,body,yes,fn){ UI.confirm = {title,body,yes}; confirmFn = fn; render(); }
function commit(){ if (UI.setup && S.draft) S.draft._step = UI.step; [S.draft,S.program].forEach(syncTargets); save(); render(); }
function toTop(){ const sc = $app.querySelector(".scroll"); if (sc) sc.scrollTop = 0; }

/* ---------- Actions ---------- */
function startSetup(fromProgram){
  const p = S.program;
  S.draft = fromProgram && p ? JSON.parse(JSON.stringify({level:p.level,splitId:p.splitId,targets:p.targets,days:p.days,alloc:p.alloc,touched:p.touched||{},direct:true})) : {level:S.level,splitId:null,targets:null,days:null,alloc:null,touched:{},direct:true};
  UI.setup = true; UI.step = fromProgram ? 0 : -1; UI.dayIdx = 0; commit();
}
function setupNext(){
  const D = S.draft;
  if (UI.step === 6) {
    S.program = {level:D.level,splitId:D.splitId,targets:D.targets,days:D.days,alloc:D.alloc,touched:D.touched||{},direct:true,createdAt:Date.now()};
    S.level = D.level; S.cycleIndex = 0; S.draft = null; UI.setup = false; UI.tab = "today"; UI.dayIdx = 0; UI.pickDay = null;
    toast("Program saved"); save(); render(); return;
  }
  if (UI.step === 0 && !D.targets) D.targets = defaultTargets(D.level);
  if (UI.step === 2) { if (!D.days) D.days = splitDays(D.splitId); if (!D.alloc) D.alloc = evenAlloc(D.days,D.targets); }
  if (UI.step === 3) UI.dayIdx = 0;
  UI.step++; commit(); toTop();
}
function openPicker(ctx,d,m,extra={}){
  const meta = getMeta(ctx), L = analyze(meta.days).dl[d], left = meta.alloc[m][d]-L[m];
  UI.sheet = Object.assign({ctx,d,m,q:"",sets:clamp(Math.round(left),1,4)},extra); render();
}
function openFix(ctx,m,by,p){
  const meta = getMeta(ctx), L = analyze(meta.days).dl, idx = trainedDays(meta.days,m);
  if (!idx.length) return;
  idx.sort((a,b) => (L[a][m]-meta.alloc[m][a]) - (L[b][m]-meta.alloc[m][b]));
  UI.dayIdx = idx[0];
  if (ctx==="program") { UI.tab = "program"; UI.progView = "days"; }
  openPicker(ctx,idx[0],m,{by:by?by.split("|"):null,p:p||null});
}
const ACT = {
  "setup-next":() => { if (!S.draft) startSetup(false); else setupNext(); },
  "setup-back":() => { if (UI.step > 0) UI.step--; else if (!S.program) UI.step = -1; else { UI.setup = false; S.draft = null; } commit(); },
  "setup-cancel":() => { UI.setup = false; S.draft = null; commit(); },
  "pick-level":d => { const D = S.draft; if (D.level !== d.v) { D.level = d.v; resetTargets(D); } commit(); },
  "pick-split":d => { const D = S.draft; if (D.splitId !== d.v) {
      const had = D.days && D.days.some(x => x.items.length);
      const go = () => { D.splitId = d.v; D.days = splitDays(d.v); D.alloc = evenAlloc(D.days,D.targets); };
      if (had) return ask("Change split?","Exercises you added are cleared because the days change.","Change split",go);
      go(); } commit(); },
  "eq-cat":d => { S.equipment.cats[d.k] = !S.equipment.cats[d.k]; commit(); },
  "eq-m":d => { S.equipment.machines[d.k] = S.equipment.machines[d.k] === false; commit(); },
  "eq-all":() => { S.equipment.machines = {}; commit(); },
  "eq-none":() => { LIB.filter(e => e.eq==="Machine").forEach(e => S.equipment.machines[e.id] = false); commit(); },
  "vol":d => { const meta = getMeta(d.ctx), m = d.m, nv = clamp(meta.targets[m]+(+d.dir),0,40); if (nv === meta.targets[m]) return;
    (meta.touched = meta.touched || {})[m] = true; setTarget(meta,m,nv); commit(); },
  "alloc":d => { const meta = getMeta(d.ctx), a = meta.alloc[d.m]; if (+d.dir > 0 && placed(meta,d.m) >= placeable(meta,d.m)) return; a[+d.i] = clamp(a[+d.i]+(+d.dir),0,20); commit(); },
  "vol-reset":d => { const meta = getMeta(d.ctx); ask("Reset volume?","Every muscle goes back to its recommended minimum, split evenly across its days. Exercises stay.","Reset",() => { resetTargets(meta); toast("Volume reset"); }); },
  "why":d => toast(d.why),
  "day":d => { const fromNav = !!d.nav; UI.dayIdx = +d.i; render(); if (fromNav) { const c = $app.querySelector(".chips"); if (c) c.scrollIntoView({block:"start"}); } },
  "sets":d => { const meta = getMeta(d.ctx), day = meta.days[+d.d], it = day.items[+d.j], m = LIB[it.ex].primary;
    if (+d.dir > 0 && trains(day,m)) { const left = meta.alloc[m][+d.d] - analyze(meta.days).dl[+d.d][m]; if (left <= TOL) return; }
    withExtras(meta,() => { it.sets = clamp(it.sets+(+d.dir), 1, 4); }); commit(); },
  "ex-remove":d => { const meta = getMeta(d.ctx), items = meta.days[+d.d].items; let it; withExtras(meta,() => { [it] = items.splice(+d.j,1); }); UI.undo = {ctx:d.ctx,d:+d.d,j:+d.j,it}; toast("Removed "+LIB[it.ex].name, true); commit(); },
  "undo":() => { const u = UI.undo; if (!u) return; const meta = getMeta(u.ctx), day = meta.days[u.d];
    if (u.x) { (day.extras = day.extras||[]).splice(u.j,0,u.it); } else withExtras(meta,() => day.items.splice(u.j,0,u.it));
    hideToast(); commit(); },
  "extra-add":d => { UI.sheet = {kind:"extras",ctx:d.ctx,d:+d.d,cat:"core"}; render(); },
  "xcat":d => { UI.sheet.cat = d.v; render(); },
  "xpick":d => { const s = UI.sheet, meta = getMeta(s.ctx), day = meta.days[s.d];
    if (d.ex != null) { const id = +d.ex, absDay = trains(day,"abs");
      const left = absDay ? meta.alloc.abs[s.d]-analyze(meta.days).dl[s.d].abs : 2;
      if (absDay && left <= TOL) return;
      withExtras(meta,() => day.items.push({ex:id,sets:clamp(Math.round(left),1,3),extra:true})); sortDay(day); toast("Added "+LIB[id].name);
    } else { const x = XB[d.x]; (day.extras = day.extras||[]).push({x:x.id,sets:x.sets,dose:x.dose}); toast("Added "+x.name); }
    UI.sheet = null; commit(); },
  "xsets":d => { const e = getDays(d.ctx)[+d.d].extras[+d.k]; e.sets = clamp(e.sets+(+d.dir),1,4); commit(); },
  "xdose":d => { const e = getDays(d.ctx)[+d.d].extras[+d.k], st = XSTEP[XB[e.x].unit]; e.dose = clamp(e.dose+(+d.dir)*st[0],st[1],st[2]); commit(); },
  "xremove":d => { const day = getDays(d.ctx)[+d.d], [it] = day.extras.splice(+d.k,1); UI.undo = {ctx:d.ctx,d:+d.d,j:+d.k,it,x:true}; toast("Removed "+XB[it.x].name, true); commit(); },
  "ex-swap":d => { const it = getDays(d.ctx)[+d.d].items[+d.j]; UI.sheet = {ctx:d.ctx,d:+d.d,j:+d.j,m:LIB[it.ex].primary,q:"",sets:it.sets}; render(); },
  "ex-add":d => { const meta = getMeta(d.ctx), left = meta.alloc[d.m][+d.d] - analyze(meta.days).dl[+d.d][d.m]; if (left <= TOL) return; openPicker(d.ctx,+d.d,d.m); },
  "slot-pick":d => { const meta = getMeta(d.ctx), di = +d.d, an = analyze(meta.days), sl = slotPlan(meta,di,d.m,an).find(p => p.k === +d.k); if (!sl) return;
    const left = meta.alloc[d.m][di] - an.dl[di][d.m]; if (left <= TOL) return;
    openPicker(d.ctx,di,d.m,{by:sl.by,pos:sl.pos,type:sl.type,slot:sl,sets:clamp(Math.min(sl.sets,Math.ceil(left)),1,4)}); },
  "credit":d => { S.creditGroups = S.creditGroups || {}; S.creditGroups[d.g] = +d.v; commit(); },
  "warm-mode":d => { S.warmMode = d.v; commit(); },
  "slots-toggle":() => { S.showSlots = S.showSlots === false; commit(); },
  "fix":d => openFix(d.ctx,d.m,d.by,d.p),
  "sheet-close":() => { UI.sheet = null; render(); },
  "sheet-pick":d => {
    const s = UI.sheet, day = getDays(s.ctx)[s.d], id = +d.ex;
    if (s.j != null) { day.items[s.j].ex = id; toast("Swapped to "+LIB[id].name); }
    else { day.items.push({ex:id,sets:s.sets}); toast(`Added ${LIB[id].name} · ${plural(s.sets,"set")}`); }
    sortDay(day); UI.sheet = null; UI.dayIdx = s.d; commit();
  },
  "fav":d => { const id = +d.ex, f = S.favorites, i = f.indexOf(id); if (i>=0) f.splice(i,1); else f.push(id); save(); const l = document.getElementById("sheet-list"); if (l) l.innerHTML = sheetList(); },
  "confirm-yes":() => { const fn = confirmFn; UI.confirm = null; confirmFn = null; if (fn) fn(); commit(); },
  "confirm-no":() => { UI.confirm = null; confirmFn = null; render(); },
  "tab":d => { UI.tab = d.v; UI.sub = null; render(); toTop(); },
  "pview":d => { UI.progView = d.v; render(); },
  "sub":d => { UI.sub = d.v || null; render(); },
  "theme":d => { S.theme = d.v; applyTheme(); commit(); },
  "set-level":d => { if (S.program.level === d.v) return; ask("Change to "+LEVELS.find(l => l.id===d.v).name+"?","Volume targets reset to the new level's defaults and are split evenly across days. Your exercises stay; each day shows what to add or trim.","Change level",() => {
    const p = S.program; p.level = d.v; S.level = d.v; resetTargets(p); toast("Level changed"); }); },
  "new-program":() => startSetup(true),
  "inc-cat":d => { S.inc[d.k] = clamp(Math.round((S.inc[d.k]+(+d.dir)*.5)*2)/2,.5,20); commit(); },
  "inc-ex":d => { const ex = LIB[+d.k]; S.incOverride[ex.id] = clamp(Math.round((incFor(ex)+(+d.dir)*.5)*2)/2,.5,20); commit(); },
  "inc-reset":d => { delete S.incOverride[+d.k]; commit(); }
};
Object.assign(ACT,WK_ACT);
const onClick = e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (fn) fn(t.dataset, e);
};
$app.addEventListener("click", onClick); $toast.addEventListener("click", onClick);
$app.addEventListener("input", e => {
  if (e.target.classList.contains("num-in") && S.active) {
    const a = S.active, en = a.entries[a.cur], st = en && en.sets[en.open]; if (!st) return;
    const v = e.target.value.replace(",","."), f = e.target.dataset.f;
    if (f === "w") st.w = v.trim()==="" || isNaN(+v) ? null : Math.max(0,+v); else st.r = Math.max(0,parseInt(v)||0);
    save(); const lb = $app.querySelector(".log"); if (lb) lb.disabled = !(st.w!=null && st.r>0 && st.rpe!=null); return;
  }
  if (e.target.id === "sheet-q" && UI.sheet) { UI.sheet.q = e.target.value; const l = document.getElementById("sheet-list"); if (l) l.innerHTML = sheetList(); }
});
$app.addEventListener("change", e => {
  if (e.target.classList.contains("num-in") && S.active) {
    // Don't re-render here: the blur happens on the press of the next tap, and replacing the DOM would swallow that tap.
    const a = S.active, en = a.entries[a.cur], st = en && en.sets[en.open];
    if (st) e.target.value = e.target.dataset.f === "w" ? (st.w == null ? "" : fmtW(st.w)) : String(st.r);
    if (en && en.phase === "warm") setTimeout(() => { if (!document.activeElement || !document.activeElement.classList.contains("num-in")) render(); }, 280);
    return;
  }
  if (e.target.id === "bk-in" && e.target.files && e.target.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(e.target.files[0]); e.target.value = ""; }
});
let touch = null;
$app.addEventListener("touchstart", e => { if (UI.mode!=="workout" || UI.sheet || UI.confirm || e.target.closest("input,.rpe-row,.bstep,.timer")) { touch = null; return; } const t = e.touches[0]; touch = {x:t.clientX,y:t.clientY}; }, {passive:true});
$app.addEventListener("touchend", e => { if (!touch || !S.active) return; const t = e.changedTouches[0], dx = t.clientX-touch.x, dy = t.clientY-touch.y; touch = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.5) { const a = S.active, i = a.cur + (dx < 0 ? 1 : -1); if (i >= 0 && i < screens(a)) { a.cur = i; save(); render(); toTop(); } } }, {passive:true});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (UI.confirm) ACT["confirm-no"](); else if (UI.sheet) ACT["sheet-close"](); } });

window.__spotr = {S:() => S, LIB, analyze, missing, lengthMissing, MIDS, defaultTargets, evenAlloc, splitDays};
if (UI.setup && !S.draft) S.draft = {level:S.level,splitId:null,targets:null,days:null,alloc:null,direct:true};
[S.program,S.draft].forEach(migrateDirect); [S.program,S.draft].forEach(syncTargets); save();
if (S.active && !UI.setup) UI.mode = "workout";
applyTheme(); render();
})();
</script>

<script>
(function(){
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        reg.addEventListener("updatefound", function(){
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener("statechange", function(){
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              var b = document.createElement("div"); b.className = "toast"; b.style.zIndex = 60;
              b.innerHTML = '<span>New version ready</span><button type="button">Reload</button>';
              b.querySelector("button").onclick = function(){ location.reload(); };
              document.body.appendChild(b);
            }
          });
        });
      }).catch(function(){});
    });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
})();
</script>
